<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>登录 - SSITAO Code Platform</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" th:href="@{/layui/css/layui.css}">
    <link rel="stylesheet" th:href="@{/layuiadmin/style/login.css}">
</head>
<body>

<div class="layadmin-user-login" id="LAY-user-login">
    <!-- 加载动画 -->
    <div class="layadmin-user-login-loading" id="loginLoading">
        <i class="layui-icon layui-icon-loading"></i>
    </div>

    <div class="layadmin-user-login-main">
        <div class="layadmin-user-login-box layadmin-user-login-header">
            <h2>SSITAO Code</h2>
            <p>后台管理系统</p>
        </div>
        <div class="layadmin-user-login-box layadmin-user-login-body layui-form">
            <!-- 错误提示 -->
            <div class="layadmin-user-login-error" th:if="${error}" th:text="${error}"></div>

            <!-- 登录表单 -->
            <form id="loginForm">
                <div class="layui-form-item">
                    <label class="layadmin-user-login-icon layui-icon layui-icon-username" for="username"></label>
                    <input type="text" name="username" id="username" lay-verify="required" placeholder="用户名" autocomplete="off" class="layui-input" th:value="${username}">
                </div>
                <div class="layui-form-item">
                    <label class="layadmin-user-login-icon layui-icon layui-icon-password" for="password"></label>
                    <input type="password" name="password" id="password" lay-verify="required" placeholder="密码" autocomplete="off" class="layui-input">
                </div>
                <div class="layui-form-item" style="margin-bottom: 20px;">
                    <input type="checkbox" name="keeplogin" lay-skin="primary" title="记住登录">
                </div>
                <div class="layui-form-item">
                    <button class="layui-btn layui-btn-fluid" lay-submit lay-filter="login-submit">登 录</button>
                </div>
            </form>
        </div>
    </div>

    <div class="layui-trans layadmin-user-login-footer">
        <p>© 2024 SSITAO Code Platform</p>
    </div>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script>
layui.config({
    base: '/' //静态资源所在路径
}).use(['form'], function(){
    var $ = layui.$
    ,form = layui.form;

    form.render();

    //提交登录
    form.on('submit(login-submit)', function(obj){
        // 显示加载动画
        $('#loginLoading').addClass('show');

        // 发送登录请求
        $.ajax({
            url: '/api/auth/login',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                username: obj.field.username,
                password: obj.field.password,
                loginType: 'PASSWORD',
                keepLogin: obj.field.keeplogin === 'on'
            }),
            success: function(res){
                $('#loginLoading').removeClass('show');
                if (res.code === 200) {
                    // 登录成功，跳转到首页
                    location.href = '/';
                } else {
                    // 登录失败
                    var errorMsg = res.msg || '登录失败';
                    $('.layadmin-user-login-error').text(errorMsg).show();
                }
            },
            error: function(xhr){
                $('#loginLoading').removeClass('show');
                var msg = '网络错误';
                try {
                    var res = JSON.parse(xhr.responseText);
                    msg = res.msg || msg;
                } catch(e) {}
                $('.layadmin-user-login-error').text(msg).show();
            }
        });

        return false; // 阻止表单默认提交
    });

    // 回车登录
    $('#password').on('keydown', function(e){
        if (e.keyCode === 13) {
            $('#loginForm').trigger('submit');
        }
    });
});
</script>
</body>
</html>
