<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>控制台</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" th:href="@{/layui/css/layui.css}">
    <link rel="stylesheet" th:href="@{/layuiadmin/style/admin.css}">
    <style>
        body {
            padding: 15px;
            background-color: #f4f4f4;
        }
        .layui-fluid {
            padding: 0;
        }
        .dashboard-header {
            margin-bottom: 20px;
        }
        .dashboard-header h2 {
            font-size: 20px;
            font-weight: 500;
            color: #333;
        }
        .dashboard-header p {
            color: #999;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="layui-fluid">
    <div class="dashboard-header">
        <h2>控制台</h2>
        <p>欢迎回来，总览系统运行状态</p>
    </div>

    <!-- 统计卡片 -->
    <div class="layui-row layui-col-space15">
        <div class="layui-col-xs12 layui-col-sm6 layui-col-md3">
            <div class="admin-stat-card">
                <div class="layui-row">
                    <div class="layui-col-xs4">
                        <div class="stat-icon blue">
                            <i class="layui-icon layui-icon-user"></i>
                        </div>
                    </div>
                    <div class="layui-col-xs8">
                        <div class="stat-content">
                            <div class="stat-title">用户总数</div>
                            <div class="stat-value" id="totalUsers">0</div>
                            <div class="stat-desc">较上周 +12%</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-xs12 layui-col-sm6 layui-col-md3">
            <div class="admin-stat-card">
                <div class="layui-row">
                    <div class="layui-col-xs4">
                        <div class="stat-icon green">
                            <i class="layui-icon layui-icon-eye"></i>
                        </div>
                    </div>
                    <div class="layui-col-xs8">
                        <div class="stat-content">
                            <div class="stat-title">访问量</div>
                            <div class="stat-value" id="totalVisits">0</div>
                            <div class="stat-desc">较上周 +8%</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-xs12 layui-col-sm6 layui-col-md3">
            <div class="admin-stat-card">
                <div class="layui-row">
                    <div class="layui-col-xs4">
                        <div class="stat-icon orange">
                            <i class="layui-icon layui-icon-cart"></i>
                        </div>
                    </div>
                    <div class="layui-col-xs8">
                        <div class="stat-content">
                            <div class="stat-title">订单数</div>
                            <div class="stat-value" id="totalOrders">0</div>
                            <div class="stat-desc">较上周 +5%</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-xs12 layui-col-sm6 layui-col-md3">
            <div class="admin-stat-card">
                <div class="layui-row">
                    <div class="layui-col-xs4">
                        <div class="stat-icon red">
                            <i class="layui-icon layui-icon-money"></i>
                        </div>
                    </div>
                    <div class="layui-col-xs8">
                        <div class="stat-content">
                            <div class="stat-title">总收入</div>
                            <div class="stat-value" id="totalAmount">0</div>
                            <div class="stat-desc">较上周 +15%</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 快捷入口 -->
    <div class="layui-row layui-col-space15" style="margin-top: 15px;">
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-header">快捷入口</div>
                <div class="layui-card-body">
                    <div class="shortcut-icons">
                        <div class="shortcut-item" onclick="openLink('/iam/account')">
                            <div class="shortcut-icon blue">
                                <i class="layui-icon layui-icon-user"></i>
                            </div>
                            <div class="shortcut-label">账号管理</div>
                        </div>
                        <div class="shortcut-item" onclick="openLink('/iam/role')">
                            <div class="shortcut-icon green">
                                <i class="layui-icon layui-icon-group"></i>
                            </div>
                            <div class="shortcut-label">角色管理</div>
                        </div>
                        <div class="shortcut-item" onclick="openLink('/iam/permission')">
                            <div class="shortcut-icon orange">
                                <i class="layui-icon layui-icon-auz"></i>
                            </div>
                            <div class="shortcut-label">权限管理</div>
                        </div>
                        <div class="shortcut-item" onclick="openLink('/iam/menu')">
                            <div class="shortcut-icon purple">
                                <i class="layui-icon layui-icon-menu"></i>
                            </div>
                            <div class="shortcut-label">菜单管理</div>
                        </div>
                        <div class="shortcut-item" onclick="openLink('/iam/userprofile')">
                            <div class="shortcut-icon blue">
                                <i class="layui-icon layui-icon-friends"></i>
                            </div>
                            <div class="shortcut-label">用户列表</div>
                        </div>
                        <div class="shortcut-item" onclick="openLink('/iam/org')">
                            <div class="shortcut-icon green">
                                <i class="layui-icon layui-icon-tree"></i>
                            </div>
                            <div class="shortcut-label">组织架构</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 图表区域 -->
    <div class="layui-row layui-col-space15" style="margin-top: 15px;">
        <div class="layui-col-md8">
            <div class="layui-card">
                <div class="layui-card-header">访问趋势</div>
                <div class="layui-card-body">
                    <div id="visitChart" style="height: 300px;">
                        <div style="text-align: center; padding: 100px 0; color: #999;">
                            <i class="layui-icon layui-icon-loading layui-icon" style="font-size: 30px;"></i>
                            <p>图表加载中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-md4">
            <div class="layui-card">
                <div class="layui-card-header">系统信息</div>
                <div class="layui-card-body">
                    <table class="layui-table" lay-skin="line">
                        <colgroup>
                            <col width="100">
                            <col>
                        </colgroup>
                        <tbody>
                            <tr>
                                <td>系统版本</td>
                                <td>1.0.0</td>
                            </tr>
                            <tr>
                                <td>框架版本</td>
                                <td>Spring Boot 2.7.x</td>
                            </tr>
                            <tr>
                                <td>前端框架</td>
                                <td>Layui</td>
                            </tr>
                            <tr>
                                <td>认证框架</td>
                                <td>Sa-Token</td>
                            </tr>
                            <tr>
                                <td>当前时间</td>
                                <td id="currentTime">-</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script>
layui.config({
    base: '/'
}).use(['element'], function(){
    var $ = layui.$;

    // 初始化
    init();

    function init() {
        // 加载统计数据
        loadStats();

        // 更新时间
        updateTime();

        // 加载图表
        loadChart();
    }

    // 加载统计数据
    function loadStats() {
        // 模拟数据
        $('#totalUsers').text('1,234');
        $('#totalVisits').text('5,678');
        $('#totalOrders').text('890');
        $('#totalAmount').text('¥12,345');
    }

    // 更新时间
    function updateTime() {
        function formatTime() {
            var now = new Date();
            var year = now.getFullYear();
            var month = String(now.getMonth() + 1).padStart(2, '0');
            var day = String(now.getDate()).padStart(2, '0');
            var hour = String(now.getHours()).padStart(2, '0');
            var minute = String(now.getMinutes()).padStart(2, '0');
            var second = String(now.getSeconds()).padStart(2, '0');
            return year + '-' + month + '-' + day + ' ' + hour + ':' + minute + ':' + second;
        }
        $('#currentTime').text(formatTime());
        setInterval(function() {
            $('#currentTime').text(formatTime());
        }, 1000);
    }

    // 加载图表（简单实现）
    function loadChart() {
        // 简单的数据展示，后续可以集成 ECharts
        setTimeout(function() {
            var chartHtml = '<div style="display: flex; align-items: flex-end; justify-content: space-around; height: 250px; padding: 20px 0;">';
            var data = [120, 200, 150, 80, 70, 110, 130];
            var max = Math.max.apply(null, data);
            for (var i = 0; i < data.length; i++) {
                var height = (data[i] / max) * 180;
                chartHtml += '<div style="text-align: center;">';
                chartHtml += '<div style="height: ' + height + 'px; width: 40px; background: linear-gradient(to top, #009688, #5ebfb3); border-radius: 4px 4px 0 0; margin: 0 auto;"></div>';
                chartHtml += '<div style="margin-top: 10px; color: #666; font-size: 12;">周' + (i + 1) + '</div>';
                chartHtml += '</div>';
            }
            chartHtml += '</div>';
            $('#visitChart').html(chartHtml);
        }, 500);
    }

    // 打开链接
    window.openLink = function(url) {
        // 通知父窗口打开Tab
        if (window.parent && window.parent.openTab) {
            var name = url.split('/').pop();
            window.parent.openTab(url, name, this);
        }
    };
});
</script>
</body>
</html>
